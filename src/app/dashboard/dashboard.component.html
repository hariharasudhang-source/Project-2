<div class="container">
  <div class="btn">
    <button mat-raised-button color="primary" (click)="openDialog('','addUser')">Add User</button>
  </div>
  
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    
      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef> No. </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>
    
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>
    
      <ng-container matColumnDef="dept">
        <th mat-header-cell *matHeaderCellDef> Dept </th>
        <td mat-cell *matCellDef="let element"> {{element.dept}} </td>
      </ng-container>
    
      <ng-container matColumnDef="join_year">
        <th mat-header-cell *matHeaderCellDef> Join_year </th>
        <td mat-cell *matCellDef="let element"> {{element.join_year}} </td>
      </ng-container>
  
      <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef> Action </th>
          <td mat-cell *matCellDef="let element">
              <mat-icon class="edit" (click)="openDialog(element,'edit')">edit</mat-icon>
              <mat-icon class="delete" (click)="openDialog(element.id,'delete')">delete</mat-icon>
          </td>
        </ng-container>
    
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
